<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · TTS Built Client Portal</title>
  <meta name="theme-color" content="#1f1e1e">
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/login.js"></script>
</head>
<body class="signin">
  <header class="topbar">
    <span class="brand"><img src="/img/tts-logo.svg" alt="TTS Built" width="97" height="22"></span>
    <div class="org"><span class="org-name">Client Portal</span></div>
  </header>
  <main class="signin-main">
    <div class="panel signin-card">
      <h1 id="title">Sign in</h1>
      <p class="lead" id="intro">View your completed jobs, with the notes and photos from each one.</p>
      <div id="msg"></div>
      <form id="form" novalidate>
        <label class="field"><span>Email</span><input type="email" name="email" autocomplete="username" required autofocus></label>
        <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
        <button class="btn primary" type="submit" id="submit">Sign in</button>
      </form>
    </div>
  </main>
  <footer class="signin-foot">Need access or forgotten your password? Contact your TTS Built representative.</footer>
</body>
</html>
